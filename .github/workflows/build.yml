name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release tagged v<package.json version>'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Verify painting-of-the-day images resolve on Wikipedia
        run: node scripts/fetch-art.js --check --strict
      - name: Chromium for the phone-version tests
        run: npx playwright install --with-deps chromium
      - name: E2E (Electron + Playwright)
        run: xvfb-run -a npx playwright test
        env:
          CI: '1'
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download painting-of-the-day images
        run: node scripts/fetch-art.js
      - name: Google sync keys (from repository secrets)
        run: node scripts/google-config.js
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
      - name: Personal touches (from repository secret)
        run: node scripts/personal-config.js
        env:
          PERSONAL_CONFIG: ${{ secrets.PERSONAL_CONFIG }}
      - name: Build portable .exe
        run: npx electron-builder --win portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: KittenPlanner-windows
          path: dist/*.exe
      - name: Read version
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Kitten Planner ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          body_path: CHANGELOG.md
          generate_release_notes: true
